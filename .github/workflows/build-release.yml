name: Build and package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check release version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a numeric x.y.z product version." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Check core behavior and DOM interactions
        run: |
          npm test
          npm run test:dom
          python3 tests/package-download.test.py
          python3 tests/runtime-cache.test.py
      - name: Find Chromium
        shell: bash
        run: |
          for browser in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              printf 'CHROMIUM_PATH=%s\n' "$(command -v "$browser")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'A Chromium-compatible browser is required for browser tests.' >&2
          exit 1
      - name: Check recovery, rules, generation and Zen mode in Chromium
        run: |
          npm run test:improvements:browser
          npm run test:browser
      - name: Verify standalone web page
        run: |
          python3 scripts/build.py --check-only
          python3 scripts/build.py --check-only --output 'nine realms.html'
      - name: Install installer tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nsis p7zip-full
      - name: Cache pinned Electron archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build-cache/electron-v*-win32-x64.zip
          key: electron-archive-${{ runner.os }}-${{ hashFiles('scripts/electron-runtime-lock.json') }}
        # The packaging script checks the pinned digest on every cache hit;
        # extracted runtimes and installers are deliberately outside this cache.
      - name: Build and verify Windows installer
        run: |
          npm run package:setup
          npm run verify:installer
          python3 -c "import pathlib, zipfile; z = zipfile.ZipFile('release/Nine-Realms-Web.zip'); assert z.testzip() is None; assert z.read('Nine Realms/index.html') == pathlib.Path('dist/index.html').read_bytes()"
          cd release
          sha256sum --check SHA256SUMS.txt
      - name: Upload tested packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nine-realms-${{ steps.version.outputs.version }}
          path: |
            release/Setup.exe
            release/Nine-Realms-Web.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  draft-release:
    name: Create draft release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nine-realms-${{ needs.package.outputs.version }}
          path: release
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          gh release create "$TAG_NAME" --verify-tag --draft \
            --title "九境 · Nine Realms $TAG_NAME" --generate-notes \
            Setup.exe
